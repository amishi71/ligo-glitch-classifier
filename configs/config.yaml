# ── Data paths ────────────────────────────────────────────────
data:
  train_dir: "data/train"
  val_dir: "data/validation"
  test_dir: "data/test"
  ml_labels_csv: "data/labels/ml_classifications.csv"
  volunteer_labels_csv: "data/labels/volunteer_classifications.csv"

# ── Model ─────────────────────────────────────────────────────
model:
  backbone: "resnet18" # resnet18 | resnet34 | efficientnet_b0
  pretrained: true
  image_size: 224

# ── Training ──────────────────────────────────────────────────
train:
  batch_size: 32
  num_workers: 2
  epochs: 20
  lr: 0.0001
  weight_decay: 0.00001
  scheduler_patience: 2
  scheduler_factor: 0.5
  use_class_weights: true
  seed: 42

# ── Output paths ──────────────────────────────────────────────
output:
  checkpoint_dir: "checkpoints"
  outputs_dir: "outputs"
  best_model_name: "best_model.pt"
